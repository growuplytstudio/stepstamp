<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#218653"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Stepstamp</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>

.hcd{background:var(--hc);color:var(--ht);border:0;box-shadow:0 7px 0 rgba(0,0,0,.2),0 14px 26px rgba(0,0,0,.14)}.hcd .mu,.hcd small{color:inherit;opacity:.9}.hcd .bar{background:color-mix(in srgb,var(--ht) 25%,transparent)}.hcd .bar i{background:var(--ht)}

.dl{font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dn{text-align:center;font-size:10px;line-height:1.15;padding:2px 0;border-radius:4px;color:#26332C}

.dc.on{background:var(--p);border-color:var(--p)}.dc.off{opacity:.35;cursor:default;background:var(--tint)}.dc.td{outline:2px solid var(--ac)}
.dp{display:flex;align-items:center;gap:6px;font-size:12px}.dp .bar{flex:1;height:8px}
.dkw{display:grid;grid-template-columns:repeat(5,1fr) 1.3fr;gap:12px}.dkw .card{margin:0}
.dr{grid-template-columns:var(--nc,170px) repeat(var(--n,35),minmax(var(--cm,22px),1fr)) var(--rc,46px 46px 58px)}
.dl{cursor:default}.dc{border:1.5px solid var(--mu);border-radius:5px}.dc.on{background:var(--tx);border-color:var(--tx);color:var(--card)}.dc.off{border-color:var(--bd)}
.dw,.dn{text-align:center;font-weight:800;font-size:11px;padding:3px 0;border-radius:4px;color:#26332C;line-height:1.2}.dn{font-weight:700}.em{text-align:center;font-size:15px}.tt .dn{background:var(--tint);color:var(--tx)}
.mc{background:#FBD9C9;color:#26332C;border:0}.mc .mn{font:800 38px/1 "Nunito Sans",sans-serif;letter-spacing:-.02em}.mc .my{font:700 20px "Nunito Sans",sans-serif;opacity:.7;margin-bottom:14px}
.mc .ms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mc .ms div{background:rgba(255,255,255,.55);border-radius:12px;padding:6px 2px;text-align:center}.mc b{display:block;font-size:22px;line-height:1.1}.mc span{font-size:11px;font-weight:700}
.ls{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;height:calc(100dvh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}.ls::-webkit-scrollbar{display:none}
.lp{flex:0 0 100%;min-width:0;scroll-snap-align:start;overflow-y:auto}.cw{position:relative;flex:1;min-height:0;margin:8px 0 0 38px}.cw svg{display:block}.cw .ya{position:absolute;left:-38px;font-size:11px;color:var(--mu);transform:translateY(-50%)}
.pd{display:flex;justify-content:center;height:30px}.pd button{width:44px;height:30px;border:0;background:none;display:grid;place-items:center;cursor:pointer}.pd i{width:9px;height:9px;border-radius:5px;background:var(--mu);opacity:.5}.pd .on i{background:var(--p);opacity:1;width:24px}
.lsm .nav{top:0;right:auto;width:calc(76px + env(safe-area-inset-left,0px));padding-left:env(safe-area-inset-left,0px);border-top:0;border-right:1px solid var(--bd)}.lsm .nav div{flex-direction:column;justify-content:center;max-width:none}.lsm .nav button{flex:none;min-height:56px;font-size:12px}
.lsm #app,.lsm #app:has(.dk){max-width:none;margin:0;padding:8px 12px 8px calc(88px + env(safe-area-inset-left,0px))}
.lsm .ls .dr{--nc:92px;--cm:0px;--rc:28px 28px 40px;gap:2px;margin:2px 0}.lsm .ls .dt{min-width:0}.lsm .dscroll{overflow:visible}.lsm .card{padding:8px}
.lsm .dl{font-size:11px}.lsm .dq,.lsm .wh{font-size:10px}.lsm .dn,.lsm .dw{font-size:9px;padding:2px 0}.lsm .em{font-size:11px}.lsm .dc{max-width:none;aspect-ratio:auto;height:26px;border-radius:4px}.lsm .spine{font-size:12px;letter-spacing:.12em;padding:6px 3px}
.dt .dr{gap:2px;margin:0;padding:2px 0;border-bottom:1px solid var(--bd);align-items:center}
.dt .dl{background:var(--tint);padding:4px 6px;border-radius:3px;font-size:12px}
.dt .dc{width:100%;max-width:20px;border:1.5px solid #8a9a90;border-radius:3px;background:#fff;color:#fff}.dt .dc.on{background:#111;border-color:#111;color:#fff}.dt .dc.off{background:var(--tint);border-color:var(--bd)}
.dt .dw,.dt .dn{background:none;color:var(--tx);padding:2px 0}.dt .dw{font-weight:800}.dt .dn{font-size:10px}
.dt .hd2{border-bottom:2px solid var(--bd)}
.vh{writing-mode:vertical-rl;transform:rotate(180deg);font:800 10px "Nunito Sans",sans-serif;letter-spacing:.08em;text-align:center;color:var(--tx);padding:2px 0;justify-self:center}
.dt .dq{background:var(--card);border:1px solid var(--bd);border-radius:2px;font-size:12px}
.spine{background:#8f7f96;font:400 34px "Nunito Sans",sans-serif;letter-spacing:.3em;color:#fff;border-radius:3px;padding:10px 8px}
.lsm .spine{font-size:12px;letter-spacing:.12em;padding:6px 3px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}.gr .card{margin:0}
.dkx{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.dkx .card{margin:0}
.wd .nav{top:0;right:auto;width:190px;border-top:0;border-right:1px solid var(--bd);justify-content:flex-start;padding-top:24px}.wd .nav div{flex-direction:column;max-width:none;padding:0 10px;gap:4px}
.wd .nav button{flex:none;text-align:left;padding:0 16px;font-size:16px;border-radius:12px;min-height:48px}.wd .nav button.on{background:var(--tint)}
.wd #app,.wd #app:has(.dk){max-width:1500px;margin:0 0 0 190px;padding:24px 32px 40px}
.wd .ov{align-items:center}.wd .sheet{border-radius:22px;max-width:520px}
.mas{columns:2 340px;column-gap:14px;max-width:1000px}.mas .card{break-inside:avoid;margin:0 0 14px}
.ls{scroll-behavior:smooth}.lp{will-change:transform,opacity;transform-origin:center}
.lp:nth-child(n+2){opacity:.3;transform:scale(.94)}
.pd i{transition:width .25s ease,opacity .25s ease,background .25s ease}
@media(prefers-reduced-motion:reduce){.ls{scroll-behavior:auto}.lp:nth-child(n){opacity:1;transform:none}.pd i{transition:none}}
.dt .dl{display:flex;align-items:center;gap:6px;background:var(--tint);border-left:5px solid var(--hc,var(--p));border-radius:8px;padding:3px 8px 3px 6px;font-weight:800;font-size:13px;min-height:30px;overflow:hidden}.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ib{font-style:normal;font-size:16px;flex:none}
.dt .dc{width:100%;max-width:21px;height:21px;aspect-ratio:auto}.dt .dc.on{background:var(--hc);border-color:var(--hc);color:var(--ht)}.dt .dc:disabled{cursor:default}.dt .dc:disabled:not(.on){background:#f1f4ef}.dt .dc.td{border:2px solid var(--ac);background:#fff;outline:0;box-shadow:0 0 0 2px rgba(244,163,64,.35)}.dt .dc.on.td{background:var(--hc)}.dt .dc.off.td{background:var(--tint)}
.dt .dq{background:var(--tint);border:0;border-radius:8px;font-weight:800;font-size:13px;padding:6px 0;color:var(--tx)}
.dt .tdh{background:var(--ac);color:#26332C;border-radius:6px}
.dkb{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1.2fr;gap:12px}.dkb .card{margin:0;padding:12px}.ph .strip{margin:4px 0 0}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.gl div{background:var(--tint);border-radius:12px;padding:8px 2px;text-align:center}.gl b{display:block;font-size:20px;line-height:1.2}.gl span{font-size:11px;color:var(--mu)}
.wd #app,.wd #app:has(.dk){padding:14px 24px 16px}.lsm .dt .dl{font-size:10px;min-height:26px;padding:2px 4px;border-left-width:3px}.lsm .ib{font-size:12px}.lsm .dt .dc{max-width:none;height:26px}.lsm .dt .dq{font-size:11px;padding:4px 0}
.cell:disabled{cursor:default}
.mas{columns:3 260px;max-width:1100px}.mas .card{padding:10px 14px;margin:0 0 10px}.mas h3{font-size:15px}.mas .mu{font-size:13px;margin:4px 0 8px}.mas .btn{min-height:40px;font-size:14px}.mas .seg .btn{min-height:40px}
</style></head><body><div id="app"></div>
<script>
const K='stepstamp.v1';
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const add=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))};
const fmt=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const DRE=/^\d{4}-\d{2}-\d{2}$/;
const CH=[['Early rising','🌅','Wake up at your target time.',1],['Daily water','💧','Drink enough water every day.',1],['Reading','📖','Read a little every day.',1],['Workout','💪','Move your body daily.',1],['No phone before bed','📵','Screens off before sleep.',0],['Journaling','📝','Write a few lines each day.',0],['Daily study','🎓','Study at a steady pace.',0]];
let S=load(),view='today',sel=null,M=null,pop=null,PEND=null,CV=null,FM=1920;
function load(){try{const r=JSON.parse(localStorage.getItem(K));if(r&&Array.isArray(r.attempts))return r}catch(e){}return{v:1,theme:'system',premium:false,onboarded:false,attempts:[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const att=id=>S.attempts.find(a=>a.id===id),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const isP=(a,d,t)=>a.pauses.some(p=>p.f<=d&&(p.t===null?d<=t:d<p.t));
function slots(a){const t=today(),o=[];let d=a.start,g=0;while(o.length<30&&g++<500){if(!isP(a,d,t))o.push({d,st:a.days[d]?'done':d<t?'miss':d===t?'now':'fut'});d=add(d,1)}return o}
function stats(a){const t=today(),s=slots(a),done=s.filter(x=>x.st==='done').length;let st=0,i=s.length-1;while(i>=0&&s[i].d>t)i--;if(i>=0&&s[i].d===t&&s[i].st!=='done')i--;for(;i>=0&&s[i].st==='done';i--)st++;const over=s[29].d<t,complete=done===30;return{s,done,streak:st,over,complete,paused:a.pauses.some(p=>p.t===null&&p.f<=t),live:!a.archived&&!over&&!complete}}
const LOGO=(z=48)=>`<svg width="${z}" height="${z}" viewBox="0 0 96 96" role="img" aria-label="Stepstamp logo"><g fill="var(--tint)"><rect width="28" height="28" rx="8"/><rect x="34" width="28" height="28" rx="8"/><rect y="34" width="28" height="28" rx="8"/><rect x="34" y="34" width="28" height="28" rx="8"/></g><g fill="#218653"><rect x="68" y="34" width="28" height="28" rx="8"/><rect y="68" width="28" height="28" rx="8"/><rect x="34" y="68" width="28" height="28" rx="8"/><rect x="68" y="68" width="28" height="28" rx="8"/></g><rect x="73" y="5" width="18" height="18" rx="5" fill="#F4A340"/></svg>`;
const MS={7:['One week of showing up.','Small steps. Real progress.'],21:['Three weeks stronger.','Look how far you’ve come.'],30:['I did it! 30 days.','One commitment. A real achievement.']};
const ms=n=>n>=30?30:n>=21?21:n>=7?7:0;
const strip=a=>`<div class="strip" aria-hidden="true">${slots(a).map(x=>`<i class="${x.st==='done'?'d':''}"></i>`).join('')}</div>`;

function vToday(){const L=S.attempts.filter(a=>stats(a).live);
return `<div class="row sp"><div class="row">${LOGO(40)}<h1>Stepstamp</h1></div>${S.premium?'<span class="pill">Premium preview</span>':''}</div><p class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p>`+
(L.length?L.map(a=>{const s=stats(a),t=today(),td=s.s.find(x=>x.d===t),y=s.s.find(x=>x.d===add(t,-1)),isDone=td&&td.st==='done';
return `<div class="card"><div class="row sp" onclick="A.open('${a.id}')" style="cursor:pointer"><div class="row"><span style="font-size:28px">${a.icon}</span><div><h3>${E(a.name)}</h3><span class="mu">${s.streak}-day streak</span></div></div><div class="big">${s.done}<small> of 30 days completed</small></div></div>${strip(a)}
${y&&y.st==='miss'&&!isDone?'<p class="mu">Yesterday was missed. Your progress is still here.</p>':''}
${s.paused?`<p class="mu">Take a pause. Your history stays safe.</p><button class="btn sec" onclick="A.rs('${a.id}')">Resume</button>`:td?`<button class="btn ${isDone?'sec':''} ${pop===a.id?'pop':''}" onclick="A.tg('${a.id}','${t}')">${isDone?'✓ Done today · Tap to undo':'Today counts. Mark your step.'}</button>${isDone?'<p class="mu" style="margin:8px 0 0">Nice work. You showed up today.</p>':''}`:`<button class="btn sec" onclick="A.open('${a.id}')">Open</button>`}</div>`}).join(''):`<div class="card" style="text-align:center"><h2>Start your first step</h2><p class="mu">Pick a 30-day challenge or make your own habit.</p><button class="btn" onclick="A.go('ch')">Choose a challenge</button></div>`)}
function vCh(){const lim=S.attempts.filter(a=>stats(a).live).length;
return `<h1>Challenges</h1><p class="mu">${S.premium?'Unlimited active challenges.':`${lim} of 3 free active slots used.`} Each challenge counts as one habit.</p>
<div class="gr">${CH.map((c,i)=>{const lk=!c[3]&&!S.premium;return `<div class="card row sp ${lk?'lock':''}"><div class="row"><span style="font-size:28px">${c[1]}</span><div><h3>${c[0]}</h3><span class="mu">${c[2]}</span></div></div>${lk?'<span class="pill">Premium</span>':`<button class="btn sm" onclick="A.ost(${i})">Start</button>`}</div>`}).join('')}
<div class="card"><h3>Your own habit</h3><p class="mu">Create a custom 30-day habit.</p><button class="btn sec" onclick="A.ost(-1)">Create custom habit</button></div></div>`}
